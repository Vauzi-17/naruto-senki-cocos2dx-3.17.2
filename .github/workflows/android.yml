name: Android Build

# Manual only for now: Actions → Android Build → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        type: string
        default: main
        required: true
      build_type:
        description: Build variant
        type: choice
        options: [debug, release, both]
        default: debug

run-name: Android ${{ inputs.build_type }} @ ${{ inputs.ref }}

concurrency:
  group: android-${{ inputs.ref }}-${{ inputs.build_type }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type }}
  BUILD_REF: ${{ inputs.ref }}
  GRADLE_VERSION: '8.5'
  CMAKE_VERSION: 3.22.1
  # NDK that AGP 8.1 picks when a branch does not set ndkVersion.
  AGP_DEFAULT_NDK: 25.1.8937393

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      # Read by CMake (3.17+) when AGP configures the native build.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      # The NDK is reinstalled every run, so its mtime changes; identify the compiler by version instead.
      CCACHE_COMPILERCHECK: '%compiler% --version'
    defaults:
      run:
        working-directory: proj.android

    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The dummy key comes from the workflow's own commit, so branches that predate it
      # (or never had it) still get signed.
      - name: Checkout signing key
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-signing
          sparse-checkout: proj.android/keystore
          sparse-checkout-cone-mode: false

      - name: Show build target
        run: |
          echo "Ref:     $BUILD_REF"
          echo "Commit:  $(git rev-parse --short HEAD) - $(git log -1 --format=%s)"
          echo "Variant: $BUILD_TYPE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses an installed Gradle instead of the repo's gradlew, whose old wrapper jar
      # fails checksum validation on some branches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Install NDK and CMake
        run: |
          ndk=$(grep -oP 'ndkVersion\s+"\K[^"]+' app/build.gradle || echo "$AGP_DEFAULT_NDK")
          echo "NDK: $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ccache keys on file contents, so unchanged engine sources are reused across runs
      # even though checkout gives every file a fresh mtime.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-armeabi-v7a
          max-size: 2G

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        run: gradle assembleRelease --stacktrace

      - name: ccache stats
        run: ccache --show-stats --verbose

      # Re-sign every APK so all CI builds share one key, whatever the branch's build.gradle does.
      # Release uses the real key when the KEYSTORE_* secrets are set; everything else uses the dummy key.
      - name: Sign APKs
        env:
          DUMMY_PASSWORD: android
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi
          for apk in app/build/outputs/apk/*/*.apk; do
            variant=$(basename "$(dirname "$apk")")
            if [ "$variant" = release ] && [ -n "$KEYSTORE_BASE64" ]; then
              set -- --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
                --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
            else
              set -- --ks "$GITHUB_WORKSPACE/.ci-signing/proj.android/keystore/dummy.keystore" \
                --ks-key-alias dummy --ks-pass env:DUMMY_PASSWORD --key-pass env:DUMMY_PASSWORD
            fi
            out="${apk%-unsigned.apk}"; out="${out%.apk}.apk"
            "$apksigner" sign "$@" --out "$out.signing" "$apk"
            rm -f "$apk" "$out.signing.idsig"
            mv "$out.signing" "$out"
            echo "$out: $("$apksigner" verify --print-certs "$out" | grep -m1 'certificate DN')"
          done

      - name: Artifact name
        id: name
        run: echo "ref=${BUILD_REF//[^A-Za-z0-9._-]/-}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-debug-${{ steps.name.outputs.ref }}
          path: proj.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-release-${{ steps.name.outputs.ref }}
          path: proj.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
