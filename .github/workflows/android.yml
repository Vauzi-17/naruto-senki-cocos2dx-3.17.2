name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build variant
        type: choice
        options: [debug, release, both]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: 24.0.8215888
  CMAKE_VERSION: 3.22.1
  # Manual runs use the chosen variant, version tags build release, everything else builds debug.
  BUILD_TYPE: ${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: proj.android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: proj.android/app/.cxx
          key: cxx-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'Classes/**', 'proj.android/app/build.gradle') }}
          restore-keys: cxx-${{ env.BUILD_TYPE }}-

      # Without these secrets, release is signed with the dummy key in proj.android/keystore.
      - name: Use real release keystore
        if: env.KEYSTORE_BASE64 != '' && env.BUILD_TYPE != 'debug'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-debug-${{ github.sha }}
          path: proj.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-release-${{ github.sha }}
          path: proj.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: proj.android/app/build/outputs/apk/*/*.apk
