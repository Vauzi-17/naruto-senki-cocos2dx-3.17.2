import org.gradle.internal.os.OperatingSystem

apply plugin: 'com.android.application'

// `-Pasan` builds with AddressSanitizer to locate memory corruption. Debug builds only.
def asanEnabled = project.hasProperty("asan")

android {
    namespace 'com.vauzi.narutosenki'
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    ndkVersion "24.0.8215888"

    defaultConfig {
        applicationId "com.vauzi.narutosenki"
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            if (PROP_BUILD_TYPE == 'ndk-build') {
                ndkBuild {
                    targets 'MyGame'
                    arguments 'NDK_TOOLCHAIN_VERSION=clang'
                    arguments '-j' + Runtime.runtime.availableProcessors()

                    def module_paths = [project.file("../../cocos2d").absolutePath,
                                        project.file("../../cocos2d/cocos").absolutePath,
                                        project.file("../../cocos2d/external").absolutePath]
                    if (OperatingSystem.current().isWindows()) {
                        module_paths = module_paths.collect {it.replaceAll('\\\\', '/')}
                        arguments 'NDK_MODULE_PATH=' + module_paths.join(";")
                    }
                    else {
                        arguments 'NDK_MODULE_PATH=' + module_paths.join(':')
                    }
                }
            }
            else if (PROP_BUILD_TYPE == 'cmake') {
                cmake {
                    targets 'MyGame'
                    arguments "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
                    if (asanEnabled) {
                        arguments "-DNARUTO_ASAN=ON"
                    }
                    cppFlags "-frtti -fexceptions -fsigned-char"
                }
            }
        }

        ndk {
            abiFilters = []
            abiFilters.addAll(PROP_APP_ABI.split(':').collect{it as String})
        }
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "../../Resources"
        if (asanEnabled) {
            resources.srcDir "asan/resources"
            jniLibs.srcDir "$buildDir/asan/jniLibs"
        }
    }

    if (asanEnabled) {
        // wrap.sh is only honored when native libs are extracted on install.
        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    externalNativeBuild {
        if (PROP_BUILD_TYPE == 'ndk-build') {
            ndkBuild {
                path "jni/Android.mk"
            }
        }
        else if (PROP_BUILD_TYPE == 'cmake') {
            cmake {
                path "../../CMakeLists.txt"
            }
        }
    }

    signingConfigs {

        // Temporary shared key: debug and release APKs can be installed over each other.
        // Not a secret; replace with a real keystore before publishing.
        dummy {
            storeFile rootProject.file("keystore/dummy.keystore")
            storePassword "android"
            keyAlias "dummy"
            keyPassword "android"
        }

       release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.dummy
            }

            externalNativeBuild {
                ndkBuild {
                    arguments 'NDK_DEBUG=0'
                }
            }
        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            signingConfig signingConfigs.dummy
            externalNativeBuild {
                ndkBuild {
                    arguments 'NDK_DEBUG=1'
                }
            }
        }
    }
}

android.applicationVariants.all { variant ->
    // delete previous files first
    delete "${buildDir}/intermediates/assets/${variant.dirName}"

    variant.mergeAssets.doLast {
        copy {
            from "${buildDir}/../../../Resources"
            into "${buildDir}/intermediates/assets/${variant.dirName}"
            exclude "**/*.gz"
        }
    }
}

if (asanEnabled) {
    // Ship the NDK's ASan runtime next to libMyGame.so; wrap.sh preloads it.
    def copyAsanRuntime = tasks.register("copyAsanRuntime", Copy) {
        from {
            fileTree(dir: android.ndkDirectory,
                     include: "toolchains/llvm/prebuilt/*/lib64/clang/*/lib/linux/libclang_rt.asan-arm-android.so").files
        }
        into "$buildDir/asan/jniLibs/armeabi-v7a"
    }
    tasks.named("preBuild").configure { dependsOn copyAsanRuntime }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libcocos2dx')
}
